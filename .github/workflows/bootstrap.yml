# Temporary: regenerates package-lock.json and applies Prettier on a runner. Removed before merge.
name: Bootstrap (temporary)

on:
  push:
    branches: [sabajamalian-octocat-supply-actions-demo]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm install
        run: npm install --no-audit --no-fund
      - name: Prettier
        run: npx prettier --write .
      - name: Commit lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Regenerate lockfile and apply Prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Format check
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm run test:coverage
      - name: Docker builds
        if: ${{ !cancelled() }}
        run: |
          docker build -f api/Dockerfile -t octacat-api:ci .
          docker build -f frontend/Dockerfile -t octacat-web:ci .
